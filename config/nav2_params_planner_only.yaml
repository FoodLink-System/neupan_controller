# Nav2 params for NeuPAN integration — PLANNER ONLY
#
# Only the global planner + costmaps run. NeuPAN handles local planning.
# No controller_server, no velocity_smoother, no collision_monitor.
# BT just computes paths at 1Hz — no FollowPath, no recovery behaviors.

bt_navigator:
  ros__parameters:
    # Minimal BT: only compute path, no following or recovery
    default_nav_to_pose_bt_xml: /opt/ros/kilted/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml
    bt_loop_duration: 10
    default_server_timeout: 20
    global_frame: map
    goal_reached_tol: 0.5
    odom_topic: odom
    robot_base_frame: base_link
    use_sim_time: true
    wait_for_service_timeout: 1000

# Only the planner_server and global_costmap are needed
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 1.0
      use_astar: true
    costmap_update_timeout: 1.0
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    use_sim_time: true

global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[-0.299, -0.180], [-0.299, 0.180], [0.299, 0.180], [0.299, -0.180]]'
      footprint_padding: 0.05
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 1.5
        inflation_radius: 0.35
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        laser_scan_sensor:
          clearing: true
          data_type: LaserScan
          inf_is_valid: true
          marking: true
          max_obstacle_height: 1.4
          min_obstacle_height: -0.2
          observation_persistence: 1.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          sensor_frame: laser_link
          topic: scan
        camera_sensor:
          clearing: true
          data_type: LaserScan
          inf_is_valid: true
          marking: true
          max_obstacle_height: 1.4
          min_obstacle_height: -0.2
          observation_persistence: 1.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.2
          raytrace_min_range: 0.0
          sensor_frame: camera_depth_frame
          topic: camera/scan
        combination_method: 1
        enabled: true
        observation_sources: laser_scan_sensor camera_sensor
        plugin: nav2_costmap_2d::ObstacleLayer
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_link
      robot_radius: 0.0
      static_layer:
        first_map_only: false
        map_topic: map
        plugin: nav2_costmap_2d::StaticLayer
        subscribe_to_updates: false
        track_unknown_space: false
        use_maximum: false
      track_unknown_space: false
      transform_tolerance: 0.5
      update_frequency: 2.0
      use_sim_time: true

local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: false
      footprint: '[[-0.299, -0.180], [-0.299, 0.180], [0.299, 0.180], [0.299, -0.180]]'
      global_frame: odom
      height: 4
      width: 4
      resolution: 0.05
      robot_base_frame: base_link
      rolling_window: true
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        laser_scan_sensor:
          clearing: true
          data_type: LaserScan
          inf_is_valid: false
          marking: true
          topic: scan
          sensor_frame: laser_link
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          observation_persistence: 1.0
          max_obstacle_height: 1.4
          min_obstacle_height: -0.2
        combination_method: 1
        enabled: true
        observation_sources: laser_scan_sensor
        plugin: nav2_costmap_2d::ObstacleLayer
      inflation_layer:
        cost_scaling_factor: 1.5
        inflation_radius: 0.55
        plugin: nav2_costmap_2d::InflationLayer
      transform_tolerance: 0.5
      update_frequency: 5.0
      publish_frequency: 2.0
      track_unknown_space: false
      use_sim_time: true

map_server:
  ros__parameters:
    frame_id: map
    topic_name: map
    use_sim_time: true
    yaml_filename: /maps/default.yaml

# Stubs — lifecycle manager requires these but they won't be used by NeuPAN
# Behavior server runs but BT never triggers recovery (replanning-only BT)
behavior_server:
  ros__parameters:
    behavior_plugins:
    - spin
    - backup
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: false
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 3.0
    use_sim_time: true
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint

# Controller runs but outputs to dead topic — NeuPAN owns /cmd_vel
controller_server:
  ros__parameters:
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 4
      model_dt: 0.25
      batch_size: 100
      vx_max: 0.01
      vx_min: 0.0
      vy_max: 0.0
      vy_min: 0.0
      wz_max: 0.01
      wz_min: -0.01
      iteration_count: 1
      motion_model: DiffDrive
      critics: []
    controller_frequency: 1.0
    controller_plugins:
    - FollowPath
    enable_stamped_cmd_vel: false
    use_sim_time: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 3.14
      stateful: false
    goal_checker_plugins:
    - goal_checker
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.001
      movement_time_allowance: 9999.0
    progress_checker_plugins:
    - progress_checker

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 1.0
    feedback: OPEN_LOOP
    max_velocity: [0.01, 0.0, 0.01]
    min_velocity: [-0.01, 0.0, -0.01]
    max_accel: [0.01, 0.0, 0.01]
    max_decel: [-0.01, 0.0, -0.01]
    enable_stamped_cmd_vel: false
    odom_topic: odom
    odom_duration: 0.1

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_nav2_unused
    enable_stamped_cmd_vel: false
    observation_sources:
    - scan
    scan:
      enabled: true
      topic: scan
      type: scan
    polygons: []
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    transform_tolerance: 0.5

docking_server:
  ros__parameters:
    dock_plugins: []
    docks: []
    use_sim_time: true
