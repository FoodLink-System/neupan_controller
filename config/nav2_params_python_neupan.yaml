amcl:
  ros__parameters:
    base_frame_id: base_link
    global_frame_id: map
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0
      z: 0.0
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    robot_model_type: nav2_amcl::DifferentialMotionModel
    scan_topic: scan
    set_initial_pose: true
    use_sim_time: true
behavior_server:
  ros__parameters:
    backup:
      acceleration_limit: 0.11
      deceleration_limit: -0.11
      minimum_speed: 0.1
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    cycle_frequency: 10.0
    drive_on_heading:
      acceleration_limit: 0.11
      deceleration_limit: -0.11
      minimum_speed: 0.1
      plugin: nav2_behaviors::DriveOnHeading
    enable_stamped_cmd_vel: false
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    global_frame: map
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    local_frame: odom
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    robot_base_frame: base_link
    rotational_acc_lim: 0.4
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors::Spin
    transform_tolerance: 3.0
    use_sim_time: true
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    # Use replanning-only BT (no recovery behaviors that fight /cmd_vel)
    default_nav_to_pose_bt_xml: /opt/ros/kilted/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml
    default_server_timeout: 20
    global_frame: map
    goal_reached_tol: 0.5
    odom_topic: odom
    robot_base_frame: base_link
    use_sim_time: true
    wait_for_service_timeout: 1000
collision_monitor:
  ros__parameters:
    FootprintApproach:
      action_type: approach
      enabled: true
      footprint_topic: local_costmap/published_footprint
      min_points: 6
      simulation_time_step: 0.1
      time_before_collision: 2.0
      type: polygon
      visualize: false
    base_frame_id: base_link
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_nav2_unused  # Redirected — Python NeuPAN owns /cmd_vel
    enable_stamped_cmd_vel: false
    observation_sources:
    - scan
    odom_frame_id: odom
    polygons:
    - FootprintApproach
    scan:
      enabled: true
      topic: scan
      type: scan
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    transform_tolerance: 0.5
    use_sim_time: true
controller_server:
  ros__parameters:
    FollowPath:
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
      CostCritic:
        collision_cost: 1000000.0
        consider_footprint: true
        cost_power: 1
        cost_weight: 8.0
        critical_cost: 300.0
        enabled: true
        near_collision_cost: 253
        near_goal_distance: 0.8
        trajectory_point_step: 2
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        threshold_to_consider: 0.5
      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        enabled: true
        threshold_to_consider: 0.3
      PathAlignCritic:
        cost_power: 1
        cost_weight: 14.0
        enabled: true
        max_path_occupancy_ratio: 0.05
        offset_from_furthest: 20
        threshold_to_consider: 0.5
        trajectory_point_step: 4
        use_path_orientations: false
      PathAngleCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
        max_angle_to_furthest: 1.0
        mode: 2
        offset_from_furthest: 4
        threshold_to_consider: 1.5
      PathFollowCritic:
        cost_power: 1
        cost_weight: 5.0
        enabled: true
        offset_from_furthest: 6
        threshold_to_consider: 0.5
      PreferForwardCritic:
        cost_power: 1
        cost_weight: 2.0
        enabled: true
        threshold_to_consider: 1.5
      ax_max: 0.22
      ax_min: -0.11
      ay_max: 0.0
      ay_min: 0.0
      az_max: 0.6
      batch_size: 1000
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      gamma: 0.015
      iteration_count: 2
      model_dt: 0.1
      motion_model: DiffDrive
      plugin: nav2_mppi_controller::MPPIController
      prune_distance: 2.5
      publish_critics_stats: false
      publish_optimal_trajectory: true
      regenerate_noises: true
      temperature: 0.3
      time_steps: 24
      transform_tolerance: 0.2
      visualize: false
      vx_max: 0.6
      vx_min: -0.2
      vx_std: 0.4
      vy_max: 0.0
      vy_min: 0.0
      vy_std: 0.0
      wz_max: 0.8
      wz_min: -0.8
      wz_std: 0.4
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    costmap_update_timeout: 0.5
    enable_stamped_cmd_vel: false
    failure_tolerance: 0.3
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.5
    goal_checker_plugins:
    - goal_checker
    min_theta_velocity_threshold: 0.01
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    progress_checker:
      movement_time_allowance: 5.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
    progress_checker_plugins:
    - progress_checker
    use_realtime_priority: false
    use_sim_time: true
docking_server:
  ros__parameters:
    dock_plugins: []
    docks: []
    use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[-0.299, -0.180], [-0.299, 0.180], [0.299, 0.180], [0.299, -0.180]]'
      footprint_padding: 0.05
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 1.5
        inflation_radius: 0.35
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        camera_sensor:
          clearing: true
          data_type: LaserScan
          inf_is_valid: true
          marking: true
          max_obstacle_height: 1.4
          min_obstacle_height: -0.2
          observation_persistence: 1.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.2
          raytrace_min_range: 0.0
          sensor_frame: camera_depth_frame
          topic: camera/scan
        combination_method: 1
        enabled: true
        laser_scan_sensor:
          clearing: true
          data_type: LaserScan
          inf_is_valid: true
          marking: true
          max_obstacle_height: 1.4
          min_obstacle_height: -0.2
          observation_persistence: 1.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          sensor_frame: laser_link
          topic: scan
        max_obstacle_height: 1.4
        min_obstacle_height: -0.2
        observation_sources: laser_scan_sensor camera_sensor
        plugin: nav2_costmap_2d::ObstacleLayer
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_link
      robot_radius: 0.0
      static_layer:
        first_map_only: false
        map_topic: map
        plugin: nav2_costmap_2d::StaticLayer
        subscribe_to_updates: false
        track_unknown_space: false
        use_maximum: false
      track_unknown_space: false
      transform_tolerance: 0.5
      update_frequency: 2.0
      use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: false
      footprint: '[[-0.299, -0.180], [-0.299, 0.180], [0.299, 0.180], [0.299, -0.180]]'
      footprint_padding: 0.05
      global_frame: odom
      height: 8
      inflation_layer:
        cost_scaling_factor: 1.5
        inflation_radius: 0.55
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        camera_sensor:
          clearing: true
          data_type: LaserScan
          inf_is_valid: false
          marking: true
          max_obstacle_height: 1.4
          min_obstacle_height: -0.2
          observation_persistence: 1.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 2.2
          raytrace_min_range: 0.0
          sensor_frame: camera_depth_frame
          topic: camera/scan
        combination_method: 1
        enabled: true
        laser_scan_sensor:
          clearing: true
          data_type: LaserScan
          inf_is_valid: false
          marking: true
          max_obstacle_height: 1.4
          min_obstacle_height: -0.2
          observation_persistence: 1.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          sensor_frame: laser_link
          topic: scan
        max_obstacle_height: 1.4
        min_obstacle_height: -0.2
        observation_sources: laser_scan_sensor camera_sensor
        plugin: nav2_costmap_2d::ObstacleLayer
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 5.0
      resolution: 0.03
      robot_base_frame: base_link
      rolling_window: true
      track_unknown_space: false
      transform_tolerance: 0.5
      update_frequency: 10.0
      use_sim_time: true
      width: 8
map_server:
  ros__parameters:
    frame_id: map
    topic_name: map
    use_sim_time: true
    yaml_filename: /maps/default.yaml
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 1.0
      use_astar: true
    costmap_update_timeout: 1.0
    expected_planner_frequency: 0.5
    planner_plugins:
    - GridBased
    use_sim_time: true
velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    feedback: OPEN_LOOP
    max_accel:
    - 0.22
    - 0.0
    - 0.6
    max_decel:
    - -0.11
    - 0.0
    - -0.6
    max_velocity:
    - 0.6
    - 0.0
    - 0.8
    min_velocity:
    - -0.2
    - 0.0
    - -0.8
    odom_duration: 0.1
    odom_topic: odom
    scale_velocities: false
    smoothing_frequency: 20.0
    use_sim_time: true
