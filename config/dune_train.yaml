robot:
  kinematics: 'diff'
  # FL1 robot footprint: 0.50m x 0.35m (width x length)
  length: 0.35
  width: 0.50

train:
  direct_train: true
  data_size: 100000
  data_range: [-5, -5, 5, 5]  # smaller range for indoor restaurant robot
  batch_size: 256
  epoch: 5000
  valid_freq: 250
  save_freq: 500
  lr: 5e-5
  lr_decay: 0.5
  decay_freq: 1500
