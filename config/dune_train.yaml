robot:
  kinematics: 'diff'
  # FL1 robot body from URDF robot1.xacro: box 0.54 x 0.355
  # base_link at wheel axle center (x=0)
  # Wheels at y=±0.121 (separation 0.242m), wheel_radius=0.0705m
  # Casters at x=±0.17
  length: 0.54
  width: 0.355

train:
  direct_train: true
  data_size: 100000
  data_range: [-5, -5, 5, 5]
  batch_size: 256
  epoch: 5000
  valid_freq: 250
  save_freq: 500
  lr: 5e-5
  lr_decay: 0.5
  decay_freq: 1500
