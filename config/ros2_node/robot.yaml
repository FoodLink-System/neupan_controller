# NeuPAN ROS2 node config for ANEWS simulation
# Used by neupan_ros2 (Python) wrapper

neupan_node:
  ros__parameters:
    use_sim_time: false  # ANEWS uses wall time

    robot_type: 'anews_fl1'
    robot_description: 'FL1 diff-drive food serving robot (0.50x0.35m)'

    planner_config_file: 'planner.yaml'
    dune_checkpoint_file: 'checkpoints/model_5000.pth'

    # TF frames — must match ANEWS bridge output
    map_frame: 'map'
    base_frame: 'base_link'
    lidar_frame: 'laser_link'

    # Laser scan processing
    scan_angle_max: 3.14
    scan_angle_min: -3.14
    scan_downsample: 2
    scan_range_max: 5.0
    scan_range_min: 0.05

    # Control
    flip_angle: false
    refresh_initial_path: true
    include_initial_path_direction: false
    control_frequency: 20.0  # match ANEWS 20Hz

    # Visualization (enable for debugging)
    enable_visualization: false
    enable_dune_markers: true
    enable_nrmp_markers: true
    enable_robot_marker: true
